name: Build and Release iOS IPA

on:
  push:
    tags:
      - 'v*' # Triggers build when you push a tag like v1.0.0
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  build:
    name: Build IPA
    # 1. Use macos-14 to target Apple Silicon (M1/M2/M3) with better queue availability
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # 2. Build the iOS Project using xcodebuild (Ad-Hoc / Unsigned for Jailbreak/Sideloading)
      - name: Build Xcode Workspace / Project
        run: |
          set -o pipefail
          xcodebuild archive \
            -scheme "IpaToolIOS" \
            -archivePath build/IpaToolIOS.xcarchive \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      # 3. Export the .xcarchive payload into an .ipa file
      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/IpaToolIOS.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r IpaToolIOS.ipa Payload

      # 4. Create GitHub Release and Upload IPA
      - name: Create Release and Upload IPA
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/IpaToolIOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
