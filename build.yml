name: Build & Package Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Xcode Selection
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Compile Application
        run: |
          xcodebuild clean build \
            -project MyApp.xcodeproj \
            -target MyApp \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CONFIGURATION_BUILD_DIR=build/Release-iphoneos

      - name: Package Payload Directory
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/MyApp.app Payload/
          zip -qr MyApp.ipa Payload

      - name: Publish to Stable Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "MyApp Latest CI Build"
          files: MyApp.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
