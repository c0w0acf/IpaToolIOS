name: Build ipatool for iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build ipatool for iOS arm64
        env:
          CGO_ENABLED: 1
          GOOS: ios
          GOARCH: arm64
        run: |
          go build -o ipatool-ios

      - name: Upload iOS Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipatool-ios
          path: ipatool-ios